  <body>
    <header>
      <div class="div_logo">
        <a href="/index.html">

      <nav>
        <ul class="menu">

      </nav>
    </header>
    <main>
      <div class="div_kontakt_form"><h3>Kontakt mig</h3></div>
        <form>
  <div class="form-group">
    <label for="first_name">Fuldenavn</label>
    <input type="text" id="first_name" name="first_name" aria-label="first-name-error" required />
    <p class="error-message">Please enter a value</p>
  </div>

  <div class="form-group">
    <label for="last_name">Telefon nummer</label>
    <input type="tel" id="telephone" name="telephone" aria-label="last-name-error" required />
    <p class="error-message">Please enter a value</p>
  </div>

  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" aria-lable="email-error" required />
    <p class="error-message">Please enter a value</p>
  </div>

  <div class="form-group">
  <label for="message">Besked</label>
  <textarea name="message" id="message" aria-lable="text-error"> </textarea>
  </div>
   
  <button>Send</button>
  
</form>

      </form>
    </main>
    <footer>
      <div>
        <img class="img_logo" src="img/logo.svg" alt="Billde af brev" />
      </div>
      <section class="section_kontakt">
        <div class="div_kontakt">
          <img class="img_kontakt" src="img/kontakt.svg" alt="Bilede af brev" />
          <p>i@inettet.dk</p>
        </div>
        <div class="div_telefon">
          <img
            class="img_telefon"
            src="img/telefon.svg"
            alt="Bilede af telefon"
          />
          <p>71 77 18 33</p>
        </div>
      </section>
      <div class="form">
        <a href="form.html" class="knap_form">Kontakt mig nu</a>
      </div>
